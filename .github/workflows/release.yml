# vtable-release-notes: 1
name: Release CI

on:
  push:
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'
      - 'hotfix/[0-9]+.[0-9]+.[0-9]+'
      - 'pre-release/[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'pre-release/[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'pre-release/[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'pre-release/[0-9]+.[0-9]+.[0-9]+-hotfix.[0-9]+'

concurrency:
  group: vtable-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # 原始 tarball 只构建一次。恢复须选择重新运行失败的作业。
    if: github.run_attempt == 1 || !(startsWith(github.ref_name, 'release/') || (startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.')))
    runs-on: macos-latest
    permissions:
      id-token: write # OIDC for npm publish (single entry)
      contents: write # push commits / tags
      pull-requests: write # create PR from release/* to main


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ (startsWith(github.ref_name, 'release/') || (startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.'))) && '22.22.2' || '20.x' }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: './common/config/rush/pnpm-lock.yaml'

      - name: Update npm
        # Alpha 和正式版在独立作业发包，旧发布路径仍在本作业直接使用 npm。
        if: ${{ !(startsWith(github.ref_name, 'release/') || (startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.'))) }}
        run: npm install -g npm@11.18.0

      - name: Install latest pnpm
        run: npm install -g pnpm@10.7.0

      - name: Install Python distutils (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install setuptools --break-system-packages

      - name: Install Python distutils (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-distutils
          python3 -m pip install setuptools --break-system-packages

      - name: Install native deps for node-canvas (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config cairo pango libpng jpeg giflib librsvg

      - name: Install native deps for node-canvas (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev pkg-config

      - name: Install rush
        run: node common/scripts/install-run-rush.js install --bypass-policy

      # ===== Release flow (stable) =====
      - name: Parse semver (release)
        if: startsWith(github.ref_name, 'release/')
        id: semver_release
        uses: xile611/read-package-version-action@main
        with:
          path: packages/vtable
          semver_string: ${{ github.ref_name }}
          semver_pattern: '^release/(.*)$'

      - name: Check version-policy version (release)
        if: startsWith(github.ref_name, 'release/')
        id: release_version_policy
        env:
          RELEASE_VERSION: ${{ steps.semver_release.outputs.full }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const policies = JSON.parse(fs.readFileSync('common/config/rush/version-policies.json', 'utf8'));
          const policyVersion = policies[0] && policies[0].version;
          const releaseVersion = process.env.RELEASE_VERSION;

          const parseVersion = version => String(version).split('-')[0].split('.').map(Number);
          const compareVersion = (a, b) => {
            const av = parseVersion(a);
            const bv = parseVersion(b);
            for (let i = 0; i < Math.max(av.length, bv.length); i++) {
              const diff = (av[i] || 0) - (bv[i] || 0);
              if (diff !== 0) {
                return diff;
              }
            }
            return 0;
          };

          if (!releaseVersion || !policyVersion) {
            console.error('Missing release version or version-policy version.', { releaseVersion, policyVersion });
            process.exit(1);
          }

          const result = compareVersion(releaseVersion, policyVersion);
          if (result < 0) {
            console.error(
              `Release version ${releaseVersion} is lower than version-policy version ${policyVersion}.`
            );
            process.exit(1);
          }

          const shouldSkip = result === 0 ? 'true' : 'false';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip_next_bump=${shouldSkip}\n`);
          console.log(
            result === 0
              ? `Release version ${releaseVersion} equals version-policy version ${policyVersion}, skip nextBump update.`
              : `Release version ${releaseVersion} is greater than version-policy version ${policyVersion}, update nextBump.`
          );
          NODE

      - name: update nextBump (release)
        if: startsWith(github.ref_name, 'release/') && steps.release_version_policy.outputs.skip_next_bump != 'true'
        uses: xile611/set-next-bump-of-rush@main
        with:
          release_version: ${{ steps.semver_release.outputs.full }}
          write_next_bump: true

      - name: Apply frozen bilingual release notes
        if: startsWith(github.ref_name, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/vtable-release
        run: node .github/scripts/release-frozen.cjs notes

      - name: Reset version-policy base version (release)
        if: startsWith(github.ref_name, 'release/')
        run: |
          node <<'NODE'
          const fs = require('fs');

          const packageJson = JSON.parse(fs.readFileSync('packages/vtable/package.json', 'utf8'));
          const policiesPath = 'common/config/rush/version-policies.json';
          const policies = JSON.parse(fs.readFileSync(policiesPath, 'utf8'));

          if (!policies[0]) {
            throw new Error('Missing version policy.');
          }

          policies[0].version = packageJson.version;
          fs.writeFileSync(policiesPath, JSON.stringify(policies));
          NODE

      - name: Generate rush version (release)
        if: startsWith(github.ref_name, 'release/')
        run: node common/scripts/install-run-rush.js version --bump

      # 各分支在构建前完成版本准备，确保编译时注入的版本与发包版本一致。
      - name: Parse Alpha version
        if: startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.')
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF#pre-release/}"
          node common/scripts/apply-release-version.js "${version#*-}" "${version%%-*}"

      - name: Parse semver (hotfix)
        if: startsWith(github.ref_name, 'hotfix/')
        id: semver_hotfix
        uses: xile611/read-package-version-action@main
        with:
          path: packages/vtable
          semver_string: ${{ github.ref_name }}
          semver_pattern: '^hotfix/(.*)$'

      - name: update nextBump (hotfix)
        if: startsWith(github.ref_name, 'hotfix/')
        uses: xile611/set-next-bump-of-rush@main
        with:
          release_version: ${{ steps.semver_hotfix.outputs.full }}
          write_next_bump: true

      - name: Generate rush version (hotfix)
        if: startsWith(github.ref_name, 'hotfix/')
        run: node common/scripts/install-run-rush.js version --bump

      - name: Update version (hotfix)
        if: startsWith(github.ref_name, 'hotfix/')
        run: node common/scripts/apply-release-version.js 'none' ${{ steps.semver_hotfix.outputs.main }}

      - name: Parse semver (pre-release)
        if: startsWith(github.ref_name, 'pre-release/') && !contains(github.ref_name, '-alpha.')
        id: semver_prerelease
        uses: xile611/read-package-version-action@main
        with:
          path: packages/vtable
          semver_string: ${{ github.ref_name }}
          semver_pattern: '^pre-release/(.*)$'

      - name: Apply prereleaseName (pre-release)
        if: startsWith(github.ref_name, 'pre-release/') && !contains(github.ref_name, '-alpha.')
        run: node common/scripts/apply-release-version.js ${{ steps.semver_prerelease.outputs.pre_release_name }} ${{ steps.semver_prerelease.outputs.main }}

      - name: Build packages
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          set -euo pipefail
          package_names=()
          while IFS= read -r package_name; do
            [ -n "$package_name" ] && package_names+=("$package_name")
          done < <(node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const packagesDir = path.join(process.cwd(), 'packages');
          const packageNames = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(packagesDir, entry.name, 'package.json'))
            .filter((packageJsonPath) => fs.existsSync(packageJsonPath))
            .map((packageJsonPath) => JSON.parse(fs.readFileSync(packageJsonPath, 'utf8')).name)
            .filter(Boolean)
            .sort();

          console.log(packageNames.join('\n'));
          NODE
          )

          build_args=()
          for package_name in "${package_names[@]}"; do
            build_args+=(--to "$package_name")
          done

          echo "Build packages: ${package_names[*]}"
          node common/scripts/install-run-rush.js release-build --parallelism 2 "${build_args[@]}"

      - name: Update shrinkwrap
        run: node common/scripts/install-run-rush.js update

      - name: Freeze first release artifacts
        if: startsWith(github.ref_name, 'release/') || (startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.'))
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/vtable-release
        run: |
          set -euo pipefail
          node .github/scripts/release-frozen.cjs prepare

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref_name, 'release/') || (startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.'))
        with:
          name: vtable-release-manifest-${{ github.run_id }}-1
          path: ${{ runner.temp }}/vtable-release/manifest.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref_name, 'release/') || (startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.'))
        with:
          name: vtable-release-prepared-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/vtable-release/*.tgz
            ${{ runner.temp }}/vtable-release/prepared.bundle
            ${{ runner.temp }}/vtable-release/manifest.json
          if-no-files-found: error

      # ===== Hotfix flow =====
      - name: Publish to npm (hotfix)
        if: startsWith(github.ref_name, 'hotfix/')
        run: node common/scripts/install-run-rush.js publish --publish --include-all --tag hotfix

      - name: Get npm version (hotfix)
        if: startsWith(github.ref_name, 'hotfix/')
        id: package_version_hotfix
        uses: xile611/read-package-version-action@main
        with:
          path: packages/vtable

      - name: Commit & Push changes (hotfix)
        if: startsWith(github.ref_name, 'hotfix/')
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit for hotfix branch.'
          else
            git add .
            git commit -m "build: hotfix version ${{ steps.package_version_hotfix.outputs.current_version }} [skip ci]" -n
            git push --no-verify origin ${{ github.ref_name }}
          fi

      # ===== Pre-release flow =====
      - name: Publish to npm (pre-release)
        if: startsWith(github.ref_name, 'pre-release/') && !contains(github.ref_name, '-alpha.')
        run: node common/scripts/install-run-rush.js publish --publish --include-all --tag ${{ steps.semver_prerelease.outputs.pre_release_type }}

      - name: Get npm version (pre-release)
        if: startsWith(github.ref_name, 'pre-release/') && !contains(github.ref_name, '-alpha.')
        id: package_version_prerelease
        uses: xile611/read-package-version-action@main
        with:
          path: packages/vtable

      - name: Commit & Push changes (pre-release)
        if: startsWith(github.ref_name, 'pre-release/') && !contains(github.ref_name, '-alpha.')
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit for pre-release branch.'
          else
            git add .
            git commit -m "build: prerelease version ${{ steps.package_version_prerelease.outputs.current_version }} [skip ci]" -n
            git push --no-verify origin ${{ github.ref_name }}
          fi


  publish-frozen:
    if: startsWith(github.ref_name, 'release/') || (startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.'))
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # 重跑作业须由恢复环境的审核者批准，原始 push 仍沿用现有 GitHub App。
    environment: ${{ github.run_attempt == 1 && 'vtable-release-push' || 'vtable-release-recovery' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Set frozen artifact directory
        run: echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/vtable-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3' # 使用内置 npm 11.19.1 支持 Trusted Publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: vtable-release-prepared-${{ github.run_id }}-1
          path: ${{ env.RELEASE_ARTIFACT_DIR }}
      - name: Publish missing frozen tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-frozen.cjs publish

  finalize-frozen:
    if: startsWith(github.ref_name, 'release/') || (startsWith(github.ref_name, 'pre-release/') && contains(github.ref_name, '-alpha.'))
    needs: publish-frozen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.run_attempt == 1 && 'vtable-release-push' || 'vtable-release-recovery' }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Set frozen artifact directory
        run: echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/vtable-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/download-artifact@v4
        with:
          name: vtable-release-prepared-${{ github.run_id }}-1
          path: ${{ env.RELEASE_ARTIFACT_DIR }}
      - name: Advance original branch and reconcile product PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-frozen.cjs finalize
