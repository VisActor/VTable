name: Release CI

on:
  push:
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: macOS-latest
    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure git user
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './common/config/rush/pnpm-lock.yaml'

      - name: Install rush
        run: node common/scripts/install-run-rush.js install --bypass-policy

      - name: Parse semver version from branch name
        id: semver_parser
        uses: xile611/read-package-version-action@main
        with:
          path: packages/vtable
          semver_string: ${{ github.ref_name }}
          semver_pattern: '^release/(.*)$'

      - name: Update nextBump of version policies
        uses: xile611/set-next-bump-of-rush@main
        with:
          release_version: ${{ steps.semver_parser.outputs.full }}
          write_next_bump: true

      - name: Update version
        run: node common/scripts/install-run-rush.js version --bump

      - name: Update version (release)
        if: startsWith(github.ref_name, 'release/')
        run: node common/scripts/apply-release-version.js 'none' ${{ steps.semver_release.outputs.main }}

      - name: Build packages
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          set -euo pipefail
          package_names=()
          while IFS= read -r package_name; do
            [ -n "$package_name" ] && package_names+=("$package_name")
          done < <(node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const packagesDir = path.join(process.cwd(), 'packages');
          const packageNames = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(packagesDir, entry.name, 'package.json'))
            .filter((packageJsonPath) => fs.existsSync(packageJsonPath))
            .map((packageJsonPath) => JSON.parse(fs.readFileSync(packageJsonPath, 'utf8')).name)
            .filter(Boolean)
            .sort();

          console.log(packageNames.join('\n'));
          NODE
          )

          build_args=()
          for package_name in "${package_names[@]}"; do
            build_args+=(--to "$package_name")
          done

          echo "Build packages: ${package_names[*]}"
          node common/scripts/install-run-rush.js build "${build_args[@]}"

      - name: Publish to npm (release)
        if: startsWith(github.ref_name, 'release/')
        run: node common/scripts/install-run-rush.js publish --publish --include-all --tag latest

      - name: Update shrinkwrap
        run: node common/scripts/install-run-rush.js update

      - name: Get npm version
        id: package-version
        uses: xile611/read-package-version-action@v2.1
        with:
          path: packages/vtable

      - name: Commit and push changes
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message: 'build: prelease version ${{ steps.package-version.outputs.current_version }}'
          branch: ${{ github.ref_name }}

      - name: Collect changelog of rush
        uses: xile611/collect-rush-changlog@main
        id: changelog
        with:
          version: ${{ steps.package-version.outputs.current_version }}

      - name: Create Pull Request
        uses: dustinirving/create-pr@v1.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[Auto release] release ${{ steps.package-version.outputs.current_version }}'
          base: main
          head: ${{ github.ref_name }}
          labels: release
          reviewers: fangsmile,Rui-Sun
          body: |
            ${{ steps.changelog.outputs.markdown }}
