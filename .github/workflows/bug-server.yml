name: Bug Server CI

# 这里业务方根据需求设置
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'develop', 'dev/*']

jobs:
  gray-scope:
    # Actions 字符串比较忽略大小写；由 Bash 精确核对分支，不检出或执行 PR 代码。
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -u nocasematch
          if [[ "$EVENT_NAME" == 'pull_request' && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$HEAD_REF" == 'codex/workflow-cn-acceptance-20261028' ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gray-scope
    if: needs.gray-scope.outputs.skip != 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './common/config/rush/pnpm-lock.yaml'

      - name: Print All Github Environment Variables
        run: env

      - name: Install rush
        run: node common/scripts/install-run-rush.js install --bypass-policy

      - name: Build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

        run:  node common/scripts/install-run-rush.js build -t @internal/bugserver-trigger

      - name: Run CI
        working-directory: ./tools/bugserver-trigger
        env:
          BUG_SERVER_TOKEN: ${{ secrets.BUG_SERVER_TOKEN }}
        run: node ../../common/scripts/install-run-rushx.js ci
