name: VisActor trusted CI dispatch
run-name: VisActor trusted CI / ${{ inputs.request_digest }}

# 只受理默认分支的固定控制请求；PR 代码不会在持有 GitHub 凭据的 job 中执行。
on:
  workflow_dispatch:
    inputs:
      request:
        description: Version-bound CI request from the trusted controller
        required: true
        type: string
      request_digest:
        description: SHA-256 of the canonical request
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.2'
      - name: Confirm the bound request (does not execute tests)
        env:
          FLOW_CI_REQUEST: ${{ inputs.request }}
          FLOW_CI_REQUEST_DIGEST: ${{ inputs.request_digest }}
        run: node common/scripts/flow-ci-dispatch.mjs
