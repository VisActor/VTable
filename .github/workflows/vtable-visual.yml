name: VTable visual regression

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/vtable-visual.yml
      - packages/vtable/**
      - packages/vtable-editors/**
      - packages/vtable-gantt/**
      - packages/vtable-plugins/**
      - packages/vtable-sheet/**
      - tools/bundler/**
      - common/config/rush/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: node common/scripts/install-run-rush.js install --ignore-hooks
      - name: Install Chromium
        run: node packages/vtable/node_modules/@playwright/test/cli.js install chromium
      - name: Check visual runner
        run: node --test packages/vtable/scripts/visual-test.test.mjs
      - name: Compare with official develop
        run: node packages/vtable/scripts/visual-test.mjs
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vtable-visual-report
          path: .vtable-visual/runs/
          if-no-files-found: ignore
          retention-days: 7
